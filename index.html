<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOPHATZ AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #000; color: #fff; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 24px; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 10px; }
  header .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
  header .logo span { background: #fff; color: #000; padding: 2px 8px; border-radius: 4px; }

  /* Modal */
  #modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
  #modal-overlay.hidden { display: none; }
  #modal-box { background: #111; border: 1px solid #333; border-radius: 16px; padding: 32px; max-width: 400px; width: 100%; text-align: center; }
  #modal-box h2 { font-size: 22px; margin-bottom: 12px; font-weight: 700; }
  #modal-box p { font-size: 14px; line-height: 1.6; color: #aaa; margin-bottom: 20px; }
  #modal-close { background: #fff; color: #000; border: none; padding: 10px 28px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
  #modal-close:hover { background: #ddd; }

  /* Messages */
  #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; max-width: 760px; width: 100%; margin: 0 auto; }
  .msg { display: flex; gap: 12px; }
  .msg .avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
  .msg.user .avatar { background: #fff; color: #000; }
  .msg.ai .avatar { background: #1a1a1a; color: #fff; border: 1px solid #333; }
  .msg .bubble { font-size: 15px; line-height: 1.6; padding-top: 4px; word-break: break-word; }
  .msg .bubble pre { background: #111; border: 1px solid #2a2a2a; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; font-size: 13px; font-family: 'Cascadia Code', 'Fira Code', monospace; }
  .msg .bubble code { font-family: 'Cascadia Code', 'Fira Code', monospace; background: #1a1a1a; padding: 1px 5px; border-radius: 3px; font-size: 13px; }
  .msg .bubble pre code { background: none; padding: 0; }

  /* Input area */
  #input-area { padding: 12px 16px 16px; background: #000; }
  #input-wrap { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  #file-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid #333; background: #111; color: #fff; font-size: 18px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  #file-btn:hover { background: #222; }
  #file-input { display: none; }
  #file-name { font-size: 11px; color: #666; max-width: 760px; margin: 0 auto 4px; text-align: center; }
  #user-input { flex: 1; padding: 14px 18px; border-radius: 24px; border: 1px solid #333; background: #111; color: #fff; font-size: 15px; outline: none; resize: none; font-family: inherit; line-height: 1.5; max-height: 120px; }
  #user-input:focus { border-color: #fff; }
  #user-input::placeholder { color: #555; }
  #send-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: #fff; color: #000; font-size: 18px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  #send-btn:hover { background: #ddd; }
  #send-btn:disabled { background: #333; cursor: not-allowed; }
  .typing span { animation: blink 1.4s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

  /* Mobile */
  @media (max-width: 600px) {
    header { padding: 12px 16px; }
    #messages { padding: 16px; gap: 12px; }
    .msg .bubble { font-size: 14px; }
    #input-area { padding: 10px 12px 12px; }
    #user-input { padding: 12px 16px; font-size: 14px; }
    #file-btn, #send-btn { width: 40px; height: 40px; }
    #modal-box { padding: 24px; }
    #modal-box h2 { font-size: 18px; }
  }
</style>
</head>
<body>

<!-- Modal -->
<div id="modal-overlay">
  <div id="modal-box">
    <h2>TOPHATZ AI</h2>
    <p>Hello there! This is an AI that is completely free to use! No limits no nothing! But isn't always active online — this does not run 24/7 and also sometimes there can be a traffic so sometimes it might be slow.</p>
    <button id="modal-close">Close</button>
  </div>
</div>

<header>
  <div class="logo"><span>TOPHATZ</span> AI</div>
</header>

<div id="messages"></div>

<div id="input-area">
  <div id="file-name"></div>
  <div id="input-wrap">
    <button id="file-btn" title="Upload file">📎</button>
    <input type="file" id="file-input" accept=".txt,.html,.htm,.css,.js,.json,.py,.md">
    <textarea id="user-input" placeholder="Message TOPHATZ AI..." rows="1" autofocus></textarea>
    <button id="send-btn">→</button>
  </div>
</div>

<script>
const OLLAMA_URL = 'https://canola-anteater-fool.ngrok-free.dev/api/chat';
const MODEL = 'qwen2.5:7b';
let history = [];
let fileContent = '';
let fileName = '';

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const fileBtn = document.getElementById('file-btn');
const fileInput = document.getElementById('file-input');
const fileNameEl = document.getElementById('file-name');
const modalOverlay = document.getElementById('modal-overlay');

// Modal
document.getElementById('modal-close').addEventListener('click', () => modalOverlay.classList.add('hidden'));
modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) modalOverlay.classList.add('hidden'); });

// File upload
fileBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  fileName = file.name;
  const reader = new FileReader();
  reader.onload = ev => {
    fileContent = ev.target.result;
    fileNameEl.textContent = `📄 ${fileName} (${(file.size/1024).toFixed(1)} KB) attached`;
    inputEl.placeholder = `Ask about "${fileName}"...`;
  };
  reader.readAsText(file);
});

// Send
sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

async function sendMessage() {
  let text = inputEl.value.trim();
  if (!text && !fileContent) return;

  if (fileContent) {
    text = `[File: ${fileName}]\n\`\`\`\n${fileContent}\n\`\`\`\n\n${text || 'Please analyze this file.'}`;
    fileContent = '';
    fileName = '';
    fileNameEl.textContent = '';
    inputEl.placeholder = 'Message TOPHATZ AI...';
    fileInput.value = '';
  }

  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;
  appendMsg(text, 'user');
  history.push({ role: 'user', content: text });

  const aiEl = appendMsg('', 'ai');
  aiEl.innerHTML = '<span class="typing"><span>●</span><span>●</span><span>●</span></span>';

  try {
    const res = await fetch(OLLAMA_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: MODEL, messages: history, stream: false })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const reply = data.message.content;
    history.push({ role: 'assistant', content: reply });
    renderAI(aiEl, reply);
  } catch (err) {
    aiEl.innerHTML = `<span style="color:#f66">⚠ ${err.message}</span>`;
  }
  sendBtn.disabled = false;
  inputEl.focus();
}

function appendMsg(text, cls) {
  const div = document.createElement('div');
  div.className = `msg ${cls}`;
  const avatar = cls === 'user' ? 'Y' : 'T';
  div.innerHTML = `<div class="avatar">${avatar}</div><div class="bubble"></div>`;
  div.querySelector('.bubble').textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div.querySelector('.bubble');
}

function renderAI(el, text) {
  let html = text
    .replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
      `<pre><code>${esc(code)}</code></pre>`)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
  el.innerHTML = html;
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
